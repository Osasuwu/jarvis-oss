# repo-baseline canon — dependabot.yml
# Ecosystems are intentionally hardcoded (pip + github-actions), not axis-rendered:
# the Renderer emits only inline YAML arrays, not the per-ecosystem block sequences
# this file needs. Repos whose ecosystems diverge (e.g. an npm package) opt the file
# into the REPO_CUSTOM escape hatch (manifest.custom_files) and ship their own copy.
#
# target-branch IS axis-rendered, from an *observed* axis read off the live audit
# rather than declared in a manifest (#1406). Hardcoding `main` here aimed every
# dependabot PR for redrobot (default branch `master`) at a branch that does not
# exist. The axis is named in the `target-branch:` lines below and deliberately
# not written out here: a placeholder inside a comment renders too, which would
# turn this explanation into a repo-specific sentence in every synced repo.
version: 2
updates:
  # Python dependencies (root)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: {{ default_branch }}

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: {{ default_branch }}
