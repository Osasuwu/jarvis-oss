# repo-baseline canon — ci-meta.yml (Guard Fixture Tests)
# Runs the meta-test suite that validates path-filtered CI guards (#326).
# Deliberately NOT path-filtered — the whole point is detecting wrong filters.
name: CI Meta — Guard Fixture Tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    # Observed axis, not a constant (#1406): hardcoding `main` meant this
    # workflow never ran on merges into redrobot, whose default branch is
    # `master` — the same bug class as dependabot.yml's target-branch.
    branches: [{{ default_branch }}]

jobs:
  meta-tests:
    runs-on: {{ runs_on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pyyaml

      - name: Run meta-tests
        # ci_meta_pytest_args is empty by default and carries its own leading
        # space. redrobot sets --confcutdir=tests/ci because pytest loads every
        # ancestor conftest during collection, and its root one imports numpy —
        # a dep this job deliberately does not install (#1406).
        run: pytest tests/ci/ -v{{ ci_meta_pytest_args }}
