# Repositories for daily triage.
# One owner/repo per line. Lines starting with # are comments.
#
# Write-action policy (enforced by skills, not this file):
#   - Repos you own       → auto-actionable (autonomous flows may close orphan
#                           milestones, attach sprints, etc.)
#   - All other owners    → flag-only / read (proposal recorded in memory,
#                           you execute manually)
#
# Local path is resolved as {device.json.repos_path}/{repo-name}.
#
# Optional trailing `project=N` token binds the repo to a GitHub Projects v2
# board (USER-owned, project number N) so the stale-backlog detector can read
# each issue's Status field. Omit it for repos without a board.
#
# Add your own repos below. Example (delete once you add real entries):
# your-username/your-repo project=1
