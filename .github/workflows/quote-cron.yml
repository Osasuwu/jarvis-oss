name: Weekly quote check

# A quoted source can change after the doc is merged, and quote-check.yml only sees the docs a
# PR touches. This runs scripts/check_quotes.py over every doc once a week and keeps one rolling
# issue (#105):
#
# - a confirmed NOT FOUND opens the issue, or appends to it if it is already open, and fails the
#   job, so the badge in README.md turns red;
# - a run with no NOT FOUND closes the open issue with a comment;
# - a source that could not be fetched never opens the issue. That covers a NOT FOUND whose
#   candidate list holds a source that could not be fetched: the script says to check that one
#   by hand first, so it is listed in the run summary with the count of unfetchable sources, and
#   the issue is left as it is.
#
# The doc list is DOC_PATHSPECS below, passed to `git ls-files`. In a git pathspec `*` also
# matches `/`, so `docs/*.md` takes nested files too. tests/test_quote_cron.py fails when a
# tracked *.md outside tests/fixtures/ is not in the list, so a new doc directory cannot be
# skipped silently.
#
# GitHub disables a scheduled workflow in a public repository after 60 days without repository
# activity; README.md says so next to the badge. There are no keep-alive commits: a grey badge
# means the check is off.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Serialize, so two runs cannot both create the issue.
concurrency:
  group: quote-cron
  cancel-in-progress: false

jobs:
  quote-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOC_PATHSPECS: |
        README.md
        .agents/skills/*.md
        docs/*.md
        examples/*.md
        resources/*.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check quotes in every doc
        run: |
          mapfile -t specs < <(printf '%s' "$DOC_PATHSPECS" | grep -v '^$')
          mapfile -d '' -t docs < <(git ls-files -z -- "${specs[@]}")
          printf 'Checking %s doc(s)\n' "${#docs[@]}"
          rc=0
          python scripts/check_quotes.py --json "$RUNNER_TEMP/quotes.json" "${docs[@]}" || rc=$?
          # 0 is clean and 1 is NOT FOUND; both leave the report for the next step.
          # Anything else is a crash, and a crash must not close the issue.
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
      - name: Update the rolling issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REPORT: ${{ runner.temp }}/quotes.json
        with:
          script: |
            const fs = require("fs");
            const TITLE = "Weekly quote check: NOT FOUND quotes";
            const MAX_BODY = 60000;
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const report = JSON.parse(fs.readFileSync(process.env.REPORT, "utf8"));

            // Only a NOT FOUND whose every candidate source was fetched is confirmed.
            const notFound = report.findings.filter((f) => f.verdict === "NOT FOUND");
            const confirmed = notFound.filter((f) => f.unfetched.length === 0);
            const unconfirmed = notFound.filter((f) => f.unfetched.length > 0);
            const unfetchable = report.unfetchable_sources.length;

            const item = (f) =>
              `- \`${f.doc}:${f.line}\`: "${f.quote}"\n  tried: ${f.tried.join(", ")}` +
              (f.unfetched.length ? `\n  could not fetch: ${f.unfetched.join(", ")}` : "");
            const list = (findings) => {
              let out = "";
              for (const f of findings) {
                const next = item(f) + "\n";
                if (out.length + next.length > MAX_BODY) {
                  out += "- … more in the run log\n";
                  break;
                }
                out += next;
              }
              return out;
            };
            const counts =
              `${report.docs} doc(s), ${report.quotes} quote(s): ` +
              `${confirmed.length} NOT FOUND, ` +
              `${unconfirmed.length} NOT FOUND with a source that could not be fetched, ` +
              `${unfetchable} unfetchable source(s).`;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", creator: "github-actions[bot]", per_page: 100,
            });
            let issue = open.find((i) => i.title === TITLE && !i.pull_request);

            let action;
            if (confirmed.length) {
              if (!issue) {
                ({ data: issue } = await github.rest.issues.create({
                  owner, repo, title: TITLE,
                  body:
                    "Written by `.github/workflows/quote-cron.yml`. Each run that finds a quote " +
                    "no longer in its source adds a comment here; a run that finds none closes " +
                    "this issue.\n\nFor each quote: fix the wording, or link the page that has " +
                    "the text. `python scripts/check_quotes.py <doc>` checks the fix locally.",
                }));
                action = `opened #${issue.number}`;
              } else {
                action = `appended to #${issue.number}`;
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `**Run:** ${runUrl}\n\n${counts}\n\n${list(confirmed)}`,
              });
            } else if (!notFound.length && issue) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Clean run, closing. ${runUrl}\n\n${counts}`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: "closed", state_reason: "completed",
              });
              action = `closed #${issue.number}`;
            } else if (!notFound.length) {
              action = "no open issue; nothing to do";
            } else {
              action =
                "only NOT FOUND with a source that could not be fetched; issue left as it is";
            }

            let summary = `**Weekly quote check:** ${counts}\n\n**Rolling issue:** ${action}\n`;
            if (unconfirmed.length) {
              summary += `\nCheck these by hand:\n\n${list(unconfirmed)}`;
            }
            await core.summary.addRaw(summary).write();
            core.info(summary);
            if (confirmed.length) {
              core.setFailed(`${confirmed.length} quote(s) NOT FOUND; see the rolling issue.`);
            }
