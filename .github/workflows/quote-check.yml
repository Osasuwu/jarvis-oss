name: Quote check

# Runs scripts/check_quotes.py on the markdown files a PR adds or changes. It fails on NOT FOUND
# only (the source was fetched and the quote is not in it); a source that could not be fetched
# is counted in the job summary and does not fail the job. No paths filter: a PR that changes no
# doc still runs the job and gets an explicit pass, so it can be made a required check later.

on:
  pull_request:

permissions:
  contents: read

jobs:
  quote-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check quotes in changed docs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t docs < <(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD -- '*.md' ':(exclude)tests/fixtures/**')
          if [ "${#docs[@]}" -eq 0 ]; then
            msg="No doc changed in this PR; nothing to check. Quote check passes."
            echo "$msg"
            echo "**Quote check:** $msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'Checking %s doc(s):\n' "${#docs[@]}"
          printf '  %s\n' "${docs[@]}"
          python scripts/check_quotes.py "${docs[@]}"
