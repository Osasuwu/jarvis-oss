name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

jobs:
  code-gate:
    # Skip fork PRs (untrusted code on main runner) and Dependabot (the
    # plugin will mark these as trivial and exit anyway, but bail earlier
    # to save Claude tokens). Draft PRs are skipped at the step-1 eligibility
    # check inside the plugin.
    #
    # The Dependabot guard keys off the PR AUTHOR (pull_request.user.login),
    # NOT the triggering actor (github.actor). github.actor changes to the
    # pusher on `synchronize` events — when merge-train.yml updates a stale
    # Dependabot branch, the actor becomes the App token, the old
    # `github.actor != 'dependabot[bot]'` guard passed, the job ran on a
    # Dependabot PR and failed, code-review-retry re-dispatched, and the
    # `review` check went red on a trivial dep bump (#944). The author is
    # stable across every pull_request event type for a given PR.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      # #1228: the verdict step's head-lineage probe lists this workflow's own
      # runs via the Actions API. Without `actions: read` the query 404s and,
      # under `set -euo pipefail`, the step dies — safe but wrong (every PR
      # would block on an infrastructure gap rather than on a review verdict).
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Timestamp anchor for the commit-free clean re-review override (#133,
      # see "Verify review verdict" below). Captured as early as possible so
      # RUN_START predates everything this run itself does — a comment the
      # plugin posts DURING this run must never be masked as "stale".
      - name: Record run start time
        id: runstart
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      # Skip review entirely when the diff has no substantive code changes.
      # EOL/whitespace-only diffs (common on Windows with CRLF) trigger the
      # plugin, which posts a non-standard "no code changes" verdict the
      # verdict-guard can't parse → fail-closed → forced admin-merge.
      # When has_code=false the review step is skipped; verdict-guard sees
      # total=0 comments and exits 0 — no review needed, nothing to block.
      # Mirror of SergazyNarynov/redrobot fix (issue #1296, commit 3c9f40e).
      - name: Check substantive diff
        id: diff
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_BASE=$(gh pr view "${{ steps.pr.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --json baseRefName -q .baseRefName)
          git fetch origin "$PR_BASE"
          # `.sql` is in the glob: schema/migration PRs are code and must be
          # reviewed (this repo is schema-drift-sensitive). A pure-.sql PR used
          # to fall through as "no code" and — worse — trip the crash below.
          #
          # grep -c prints "0" AND exits 1 when there are zero matches. The old
          # `|| echo 0` then APPENDED a second "0", so LINES became the two-line
          # string "0\n0" and `echo "lines=$LINES" >> $GITHUB_OUTPUT` wrote a
          # malformed second line → "##[error]Invalid format '0'" → the step
          # (and the whole `review` check) failed on any PR touching only
          # non-listed extensions. Use `|| true` (grep already emits the count)
          # and default-guard the empty-pipeline case.
          LINES=$(git diff "origin/$PR_BASE"...HEAD -- \
            '*.py' '*.ts' '*.tsx' '*.js' '*.jsx' \
            '*.yaml' '*.yml' '*.json' '*.sh' '*.ps1' '*.md' '*.sql' \
            | grep -cE '^[+-][^+-]' 2>/dev/null || true)
          LINES=${LINES:-0}
          HAS=$( [ "$LINES" -gt 0 ] && echo true || echo false )
          echo "lines=$LINES" >> "$GITHUB_OUTPUT"
          echo "has_code=$HAS" >> "$GITHUB_OUTPUT"
          echo "Substantive diff lines: $LINES (has_code=$HAS)"

      # Skip review when the push comes from the auto-rebase bot. osasuwu-ci[bot]
      # exclusively pushes "Merge branch 'main' into <feature>" commits — pure
      # housekeeping with no new code. Without this guard, each rebase triggers a
      # full review run: PR #963 accumulated 28 auto-rebase pushes → 23 spurious
      # review comments despite only 4-5 real rework rounds (incident 2026-06-29).
      #
      # MUST stay at step level (not job `if:`): the job-level condition must not
      # use github.actor — the dependabot[bot] guard already keys off PR author
      # for stability across synchronize events, and test_code_review_dependabot_skip.py
      # asserts that github.actor is absent from the job `if:` (#944 regression pin).
      - name: Skip auto-rebase push
        id: autobase
        if: github.event_name == 'pull_request' && github.actor == 'osasuwu-ci[bot]' && github.run_attempt == 1
        run: |
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Push by osasuwu-ci[bot] is an auto-rebase only (no new code); skipping code review."

      - name: Run code review (Layer B)
        id: review
        if: steps.autobase.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || steps.diff.outputs.has_code == 'true')
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude-code-action@v1 added an `allowed_bots` gate that hard-fails
          # ("Workflow initiated by non-human actor") when the triggering actor
          # is a Bot. Two LEGITIMATE bot triggers exist in this pipeline and
          # both jammed the `review` check across every in-flight PR:
          #   - code-review-retry.yml reruns the failed run in place (#1325:
          #     `gh run rerun <id> --failed`, not workflow_dispatch); actor is
          #     whatever originally triggered that run — including
          #     osasuwu-ci[bot] on a retried autobase push, which (#1523) can
          #     now reach this step on attempt >= 2 once the autobase skip's
          #     own run_attempt == 1 gate disarms.
          #   - merge-train.yml's update-branch fires a `synchronize` whose
          #     actor is the merge-train GitHub App token (a [bot] login).
          # "*" is safe here despite the action's public-repo warning: the
          # job-level `if:` requires head.repo.full_name == github.repository,
          # so fork/external PRs never reach this step, and workflow_dispatch /
          # branch pushes both require repo write access. No untrusted external
          # actor can initiate this run. Allowed-tools are locked read-only
          # below, except Write — the reviewer composes its verdict comment at
          # /tmp/code-review-comment.md and posts via `gh pr comment --body-file`
          # so review prose never passes through shell string-interpretation
          # (#971). Write is granted unscoped (not Write(//tmp/**)) because the
          # `//tmp/**` glob failed to match `/tmp/...` on the Linux runner,
          # denying the verdict Write and degrading the post step.
          # Uniform across owned repos for the M48 baseline.
          allowed_bots: "*"
          prompt: |
            You are Layer B of a two-layer code-review gate (#1816). Layer A
            (ruff, exit-code only) already caught syntax/style/dead-code/bare-
            except/mutable-default-arg mechanically — do NOT re-report those.
            Your job is the class of defect that requires judgment, not a
            deterministic tool: git-blame/log context, cross-file reasoning,
            comparing the diff against the issue's stated intent.

            Review PR #${{ steps.pr.outputs.number }} in repo
            ${{ github.repository }}:

            1. `gh pr view <n> --json title,body,baseRefName,headRefOid` and
               `gh pr diff <n>` to get the diff and the linked issue's intent.
            2. Skip review (post nothing, exit 0) if the PR is a draft, or the
               diff has no code changes, or a `### Code review` comment from
               you already covers the current head SHA with no new commits
               since.
            3. Evaluate the diff against EXACTLY these 8 finding classes — no
               others, no severity ladder, no nitpicks:
               - `regression` — reintroduces a bug a prior commit fixed. Use
                 `git log`/`git blame` on the touched lines to check history
                 before flagging this; it is the one class that needs blame
                 context, not diff-only reading.
               - `exception-handling` — the caught type is correct but the
                 recovery is wrong for this domain, or the failure is silently
                 swallowed instead of surfacing (semantic, not the bare-`except`
                 *form* Layer A already caught).
               - `intent-vs-logic` — the code does not do what the linked
                 issue/PR description says it should.
               - `breaking-contract` — a signature/behavior change breaks a
                 caller outside this diff. Use `git grep`/`Grep` across the repo
                 to check call sites before flagging.
               - `concurrency` — a race, deadlock, or ordering bug.
               - `requirement-semantics` — the diff doesn't actually satisfy an
                 acceptance criterion from the linked issue.
               - `design-modularity` — real erosion of module boundaries or
                 cohesion introduced by this diff, not a style preference.
               - `performance` — an N+1 or added O(n²)-in-the-diff that a
                 reader would flag, not a micro-optimization nitpick.
            4. For git-blame/log context, keep it narrow: blame only the lines
               the diff touches, plus the fix commit's message if blame finds
               one. Do not dump whole files or the import graph into your own
               context — diff + narrow blame outperforms full-context review
               (monotonic degradation with more context is documented; stay
               tight).
            5. Post exactly one PR comment via `gh pr comment <n> --body-file
               /tmp/code-review-comment.md` (compose the body with Write, never
               inline shell string-interpolation of review prose). The comment
               body is prose summarizing what you found (or "No issues found."
               if clean), followed by this exact HTML comment as the LAST thing
               in the body:

               <!-- code-review-findings
               {"blocking": <bool>, "findings": [{"class": "<one of the 8 class
               names above>", "file": "<path>"}, ...]}
               -->

               `blocking` is true iff `findings` is non-empty; `findings` is
               empty iff `blocking` is false — the two must agree. Every
               finding's `class` MUST be one of the 8 literal strings above,
               spelled exactly as given. Do not emit a line number or a
               severity field — this schema deliberately carries neither.

            Do NOT load Jarvis SOUL.md, do NOT call memory_recall/memory_store
            (not available in this runner).
          claude_args: |
            # The reviewer runs headless — any tool it invokes that is absent
            # here is DENIED (no human to approve). Read/Grep/Glob cover file
            # discovery and reading. read-utils (head/tail/cat/sort/uniq/cut/
            # nl/tr/echo) cover compound commands the agent composes (e.g.
            # `echo … ; gh pr view …`, `git show <sha>:<f> | wc -l`): headless
            # permission matching splits on ; | && and newlines and checks EACH
            # sub-command, so an un-allowlisted `echo`/`head` prefix denies the
            # whole compound even when the real command is allowlisted. Missing
            # tools produce repeated permission_denials → the agent flails at
            # the comment-post step (probe/fragment comments, or no post) →
            # verdict gate fails closed → admin-merge. sed/awk/python3(-c)/jq
            # are deliberately EXCLUDED (write-capable interpreters — a
            # different axis than the model below, kept as a flat ban).
            #
            # #1850 DENYLIST REBUILD. Every prior incident here (#1042, #1198,
            # #1210, #1218, #1223, #1841 — five rounds since the plugin was
            # first stood up) was the SAME shape: the reviewer needed a git/gh
            # READ verb nobody had enumerated yet (a new `gh api` path, a new
            # git plumbing command, a merge-commit's second parent), it got
            # denied, the reviewer went blind, and someone patched in the one
            # missing prefix — until the next unenumerated verb. Enumerating
            # every read command an LLM might compose is open-ended; it will
            # never converge. Enumerating the MUTATING subset of git/gh is
            # bounded and small, so that's the axis the allowlist now keys on:
            # `Bash(git:*)` and the `gh` noun-groups the reviewer actually
            # touches (pr/issue/search/label) are granted WHOLESALE, and
            # `--disallowed-tools` below carves the mutating verbs back out.
            # `gh api` stays on its OWN narrow two-pattern grant, not folded
            # into a wholesale `gh:*` — its `-X <method>`/`--input` mutation
            # flags can appear in any position in the command line, so a
            # prefix-matched disallow entry can't reliably catch every
            # spelling of "this call mutates" the way a bounded verb list can
            # for `gh pr`/`gh issue`/`gh label`. Per the deny>allow precedence
            # documented for this action (disallowed-tools is applied first,
            # then allowed-tools resolved against what's left), a disallow
            # entry always wins over a broader allow, so the wholesale grants
            # below are safe as long as the disallow list stays complete.
            # (tests/ci/test_code_review_allowed_tools.py pins both lists.)
            --allowed-tools "Read,Grep,Glob,Write,Bash(git:*),Bash(gh pr:*),Bash(gh issue:*),Bash(gh search:*),Bash(gh label:*),Bash(gh api repos/*/commits/*:*),Bash(gh api repos/*/compare/*:*),Bash(wc:*),Bash(head:*),Bash(tail:*),Bash(cat:*),Bash(sort:*),Bash(uniq:*),Bash(cut:*),Bash(nl:*),Bash(tr:*),Bash(echo:*),Bash(python -m py_compile:*),Bash(python3 -m py_compile:*),Bash(bash -n:*),Bash(node --check:*)"
            # Mirrors the `--disallowed-tools` idiom already used by
            # agent-dispatch.yml for the same headless-action pattern. Same
            # honest caveat applies here too: `Bash(...:*)` is a literal
            # PREFIX match, not a parse of the actual command, so a
            # differently-ordered or differently-flagged spelling can slip a
            # finite list. This is defense-in-depth, not the sole hard
            # boundary:
            #   - `gh pr merge` is additionally stopped by branch protection
            #     server-side (required status checks, including THIS gate,
            #     block the merge even if the API call is attempted) — a real
            #     hard backstop, not just this prefix list.
            #   - `git push`/`gh issue *` have no such backstop: this job's
            #     token (`contents: read`, `pull-requests: write`) genuinely
            #     could push nothing (read-only contents) but a `gh pr
            #     close`/`edit`/`review` call would actually succeed against
            #     the API if it slipped past this list. That residual risk is
            #     accepted the same way agent-dispatch.yml accepts it for
            #     force-push spellings — the review prompt scopes the
            #     reviewer to "post exactly one PR comment", and this list
            #     covers every straightforward spelling of the mutating verbs
            #     in the noun-groups granted above.
            # git: only the mutating/state-altering subset is denied; plain
            # reads (show/blame/log/diff/grep/ls-tree/fetch/rev-parse/…) stay
            # open under the wholesale `Bash(git:*)` grant above — that
            # openness is the entire point of this rebuild (#1850).
            --disallowed-tools "Bash(gh pr merge:*)" "Bash(gh pr close:*)" "Bash(gh pr edit:*)" "Bash(gh pr reopen:*)" "Bash(gh pr review:*)" "Bash(gh pr ready:*)" "Bash(gh pr create:*)" "Bash(gh pr lock:*)" "Bash(gh pr unlock:*)" "Bash(gh issue create:*)" "Bash(gh issue edit:*)" "Bash(gh issue close:*)" "Bash(gh issue reopen:*)" "Bash(gh issue delete:*)" "Bash(gh issue lock:*)" "Bash(gh issue unlock:*)" "Bash(gh issue pin:*)" "Bash(gh issue unpin:*)" "Bash(gh issue transfer:*)" "Bash(gh issue comment:*)" "Bash(gh label create:*)" "Bash(gh label edit:*)" "Bash(gh label delete:*)" "Bash(git push:*)" "Bash(git commit:*)" "Bash(git merge:*)" "Bash(git reset:*)" "Bash(git rebase:*)" "Bash(git cherry-pick:*)" "Bash(git stash:*)" "Bash(git clean:*)" "Bash(git rm:*)" "Bash(git mv:*)" "Bash(git apply:*)" "Bash(git am:*)" "Bash(git checkout:*)" "Bash(git switch:*)" "Bash(git restore:*)"

      # Diagnostic escape hatch for silent no-review runs (#1239). The action
      # runs with `show_full_output` unset, so the orchestrator's turns are
      # hidden "for security" and the ONLY copy of what the reviewers actually
      # did is the runner-local execution log. When the run reports
      # is_error=false / 0 denials and still posts nothing (observed 3/3 on PR
      # #1237), both diagnostic steps below say "nothing to verify" and the
      # evidence dies with the runner. Uploading the log makes that case
      # diagnosable after the fact instead of only reproducible live.
      #
      # Content is agent tool-calls and review prose over a PUBLIC repo, so the
      # artifact carries nothing the diff doesn't already expose; secrets are
      # not in scope because the allowed-tools set is read-only and the agents
      # never read .env. Retention is short on purpose — this is a tripwire
      # payload, not an archive.
      - name: Upload review execution log
        if: always() && steps.review.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.review.outputs.execution_file }}
          retention-days: 7
          if-no-files-found: warn

      # Auto-merge MERGE gate (Gate 1 of the two-gate model, #988). Without
      # this step the `review` check is SUCCESS as long as the bot ran —
      # auto-merge can't distinguish "ran cleanly" from "found a blocking bug".
      # This step turns the `review` check into a real verdict.
      #
      # #1816 REBUILD: Layer B (the sole reviewer now) always emits a
      # machine-readable <!-- code-review-findings --> block carrying exactly
      # one bit of signal — {"blocking": bool, "findings": [{"class","file"}]}
      # — across 8 closed finding classes, no severity ladder. That block is
      # authoritative in BOTH directions (block AND pass) whenever present; see
      # its own comment further down. The prose severity ladder below is kept
      # only as a defensive fallback for a comment that lacks the marker
      # entirely (pre-rebuild or unrelated-bot comment) — it never runs
      # against a well-formed structured block. The two-gate-model MERGE vs.
      # REWORK-done split (scripts/rework_policy.py) and the fingerprint-set
      # convergence it drives are unaffected by this rebuild.
      #
      # TWO-GATE MODEL (prose-ladder fallback only): the MERGE gate (here)
      # blocks ONLY on a merge-blocking finding — an all-caps CRITICAL/MAJOR/
      # BLOCKING severity heading. MINOR / NITPICK / LOW / INFO / MEDIUM and a
      # bare "Found N issues:" line do NOT block. This matches the REWORK-done
      # gate (scripts/rework_policy.py: n_critical==0 AND n_major==0): a PR
      # clean of real bugs but carrying minor nits no longer ping-pongs
      # between "rework thinks it's done" and "merge gate rejects it" (#976 —
      # PRs were taking 3-5 rework rounds). Minors are swept best-effort by
      # /rework only while it is already in context for a bug-triggered round;
      # they never trigger rework alone.
      #
      # Incident still guarded (PR #957): the bot posted findings under a
      # deviant title "## Claude Code Review — PR #957" with "### MAJOR
      # findings" / "### MINOR findings" sections. The old selector matched
      # only the literal `### Code review` prefix, so the comment counted as
      # "no comment → pass" and the PR auto-merged unreviewed. The deviation is
      # routine — observed shapes: "### MAJOR findings" (#957), bare
      # "### MAJOR" (#956), "### 🔴 BLOCKING" (#954). Hardened contract
      # (mirrored by tests/ci/test_code_review_verdict_guard.py):
      #   - SELECT the latest comment containing any heading line that looks
      #     like a code-review title (1-6 #'s, optional "Claude", any case,
      #     anywhere in the body — deviant bots may prepend preamble).
      #   - BLOCK signal checked FIRST so no pass signal can shadow it:
      #     all-caps CRITICAL/MAJOR/BLOCKING severity heading (1-6 #'s,
      #     optional decoration, optional findings/issues suffix). MINOR is
      #     NOT in the alternation; the check is case-SENSITIVE (grep -qE, not
      #     -qiE) so title-case "Blocking issues — None" (#962) is not a false
      #     block (#976).
      #   - PASS signals (all exit 0; reached only when no block heading):
      #     "No issues found." (clean), "Blocking issues — None" (#962 APPROVE,
      #     case-insensitive), "Found N issues:" (advisory findings, #956), and
      #     MINOR/NITPICK/LOW/INFO/MEDIUM-only severity sections (#963).
      #   - Selected comment matching none of the above → exit 1, fail-closed.
      #   - No selected comment at all → pass (plugin legitimately skips
      #     drafts / already-reviewed / not-eligible PRs). Residual risk: a
      #     review title with no "Code Review" wording at all still slips
      #     through here; accepted — selection can't be author-based (other
      #     bots comment too) and findings-shaped selection would wrongly
      #     gate on `### Simplification opportunities` comments, which are
      #     informational-only by design (see event-dispatch.yml).
      #
      # Runs on BOTH pull_request and workflow_dispatch. The dispatch path is
      # the retry. CORRECTED (#1325): a workflow_dispatch check-run DOES attach
      # to the PR head SHA correctly — verified live via the check-runs API.
      # The real gap was elsewhere: code-review-retry.yml used to fire a FRESH
      # `gh workflow run` dispatch on every retry, which creates a NEW run (and
      # a new `review` check-run) alongside the earlier failing one instead of
      # replacing it — a stale failing check-run persisting next to a later
      # success left `mergeStateStatus` BLOCKED with no self-heal (#1325
      # Finding 2). Since #1325, the retry instead reruns the SAME failed run
      # in place (`gh run rerun <id> --failed`, code_review_retry.py::_dispatch),
      # so the one `review` check-run is updated to the new conclusion rather
      # than shadowed by a second one — closer to how a real `pull_request`
      # synchronize re-run behaves. If the verdict step were gated to
      # pull_request only, a retry that surfaced findings would post them but
      # skip this gate → the run goes green → auto-merge with findings. That
      # hole was dormant only because the `allowed_bots` jam made retries fail
      # at the action level; closing that jam (above) makes retries succeed, so
      # this gate must enforce on the dispatch path too. steps.pr.outputs.number
      # resolves on dispatch via inputs.pr_number, so the lookup works for both
      # events.
      # Loud-fail diagnostic (mirror of SergazyNarynov/redrobot PR #1304). The
      # verdict guard below fails CLOSED on a missing/unparseable comment — which
      # masks two very different causes as one "re-run code-review" message:
      #   (a) the model genuinely posted no blocking verdict, vs
      #   (b) the review run itself broke — is_error=true, or its subagents were
      #       permission-denied tools they need (allowlist drift between this
      #       workflow's claude_args --allowed-tools and the plugin command's
      #       frontmatter), so the orchestrator burned turns and never posted.
      # When (b) happens the verdict guard says "errored, re-run" but a re-run
      # hits the SAME wall silently. This step reads the action's execution log
      # and fails LOUDLY with the exact denied tool calls, so allowlist drift is
      # self-diagnosing instead of presenting as a flaky verdict gate.
      #
      # POLICY (#1242, decision bf771ebd): BLINDED-ONLY — a denial fails the
      # gate only when it left NO fresh verdict for the head SHA. This
      # supersedes the #1229 strict tripwire (mandate faaf6671: "widen the
      # allowlist, never soften"), whose premise — 0 denials reachable via
      # allowlist widening — was falsified by the observed denial classes:
      # sandbox write-boundary redirects (PR #1241: `git show > /tmp/...`
      # blocked by the workspace-only write sandbox, not a prefix miss) and
      # never-allowlistable exec shapes (PR #1243: `python3 - <<EOF` heredoc,
      # `find -exec`). Both runs completed and posted their verdicts; the
      # strict gate false-failed healthy reviews. Same conclusion redrobot
      # reached earlier (redrobot#1408, decision f96089ee) — the two repos now
      # share one canon policy.
      - name: Verify review ran cleanly
        if: steps.autobase.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || steps.diff.outputs.has_code == 'true')
        env:
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
          # Needed for the verdict-presence query below: a denial only fails the
          # gate when it left NO fresh verdict for the head SHA (#1242).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${EXEC_FILE:-}" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "::notice::No execution log (review skipped or produced no output); nothing to verify."
            exit 0
          fi
          # EXEC_FILE holds the RAW SDKMessage[] written by claude-code-action's
          # writeExecutionFile() — the result object's real field is the array
          # `permission_denials`. `permission_denials_count` is a display-only
          # field synthesized by the action's console-log sanitizer and is
          # normally absent from EXEC_FILE; reading it ALONE always silently
          # resolved to the `// 0` fallback regardless of actual denials
          # (#1210 — CI showed raw counts of 14/15/17 vs. this step parsing 0).
          #
          # AGGREGATE ACROSS THE WHOLE LOG, not `[.[] | select(.type=="result")]
          # | last` (#1229). The plugin's /code-review spawns subagents and the
          # stream can carry more than one `result` object; a trailing result
          # reporting 0 SHADOWS the real aggregate when selected with `last`.
          # This is not theoretical — the same shared plugin produced it in
          # redrobot (redrobot#1371, PR #1362 run 28666054188): the action's own
          # summary reported 11 denials while a `last`-selecting guard read 0
          # and passed green, defeating the exact check it exists to enforce.
          # Take the max count found anywhere (recursive `..`) AND the size of
          # the unioned permission_denials[] arrays, whichever is larger, so
          # neither a zeroed trailing result nor a relocated field can mask a
          # denial. is_error stays scoped to result objects (true on any).
          is_error=$(jq -r 'any(.[] | select(.type == "result"); .is_error == true)' "$EXEC_FILE")
          count_field=$(jq -r '[.. | .permission_denials_count? // empty] | max // 0' "$EXEC_FILE")
          count_array=$(jq -r '[.. | .permission_denials? // empty] | add // [] | length' "$EXEC_FILE")
          denials=$(( count_field > count_array ? count_field : count_array ))
          echo "Review result: is_error=$is_error permission_denials_count=$denials"
          if [ "$is_error" = "true" ]; then
            echo "::error::Code review run reported is_error=true — the model call failed. Failing loudly (not masking as a verdict-guard fail-closed)."
            exit 1
          fi
          if [ "$denials" -eq 0 ]; then
            echo "::notice::Code review ran cleanly (0 permission denials)."
            exit 0
          fi
          # BLINDED-ONLY (#1242, decision bf771ebd; canon policy shared with
          # redrobot per f96089ee): denials>0 fails the gate ONLY when the run
          # posted no fresh verdict for the head — i.e. the denial actually
          # BLINDED the reviewer into never completing. The observed denial
          # classes (sandbox write-boundary redirects, `python3` heredocs,
          # `find -exec`) are structurally un-allowlistable, so the denial
          # COUNT is the wrong signal; a run that hit one yet still posted a
          # complete verdict is not blinded. Accepted residual risk: a fresh
          # verdict does not prove the reviewer recovered from every denial —
          # mitigated because the denied op was BLOCKED by the sandbox (never
          # executed) and the verdict guard below still classifies the posted
          # comment, fail-closing on blocking/unparseable verdicts. Always log
          # the denied calls loudly (allowlist tuning signal — add read-only
          # ones if they recur; NEVER allowlist python3/jq/awk/sed).
          echo "::warning::Code review hit $denials permission denial(s). Checking whether a fresh verdict was still posted before deciding to fail."
          echo "Denied tool calls:"
          jq -r '[.. | .permission_denials? // empty] | add // [] | .[]
                 | "  - \(.tool_name): \(.tool_input | tostring | .[0:160])"' \
            "$EXEC_FILE" 2>/dev/null | sort -u || true

          # Freshness-anchored verdict-presence check — same comment selector
          # and head-time anchor as the verdict guard below (#993). Plain
          # HEAD_TIME is safe here: this step is skipped on autobase pushes
          # (`steps.autobase.outputs.skip != 'true'` above), so the #1134
          # non-bot-head anchor case cannot arise. If the query fails, the
          # `set -e` pipeline aborts the step → fail closed, never pass on an
          # unverifiable claim.
          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid)
          HEAD_TIME=$(gh api "repos/$REPO/commits/$HEAD_SHA" -q .commit.committer.date)
          fresh=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            | jq -rs --arg head "$HEAD_TIME" 'add
                | map(select(.body | test("(^|\\n)#{1,6}[ \\t]*(Claude[ \\t]+)?Code[ \\t]+Review"; "i")))
                | map(select(.created_at >= $head)) | length')

          if [ "${fresh:-0}" -gt 0 ]; then
            echo "::warning::A fresh /code-review verdict was posted for $HEAD_SHA despite $denials denial(s); treating denials as non-fatal (#1242). The verdict guard below classifies the posted comment."
            exit 0
          fi

          echo "::error::Code review hit $denials permission denial(s) AND posted no fresh verdict for $HEAD_SHA — the reviewer was blinded and never completed. Failing closed; re-run code-review."
          exit 1

      - name: Verify review verdict
        # #1134: RUN on the osasuwu-ci[bot] auto-rebase push too (do NOT gate on
        # steps.autobase.outputs.skip here). On that push HEAD is the bot's
        # 2-parent merge commit; skipping left the `review` check green with
        # nothing evaluated and native auto-merge shipped #1131 past a live
        # CRITICAL. Instead the step runs and, when SKIP=true, anchors comment
        # freshness on the last non-bot head (see ANCHOR_TIME below).
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          SKIP: ${{ steps.autobase.outputs.skip }}
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
          # #133: this run's own start time, used by the commit-free clean
          # re-review override below to tell "posted before this run" apart
          # from "posted during this run".
          RUN_START: ${{ steps.runstart.outputs.time }}
          # #1434: positive evidence that there was something to review. The diff
          # step measures the PR's FULL base...HEAD diff, so it stays meaningful
          # on an auto-rebase push whose own diff is empty (it read has_code=true
          # on PR #1435's autobase run, 299 lines). Empty on workflow_dispatch,
          # where the diff step does not run — treated as unknown, never as
          # "nothing to review".
          HAS_CODE: ${{ steps.diff.outputs.has_code }}
        run: |
          set -euo pipefail
          # Freshness anchor (#993): a /code-review comment is a verdict only for
          # the CURRENT head commit. The review action sometimes errors on turn 1
          # (is_error, ~$0 cost, no comment posted for this SHA). Without a
          # freshness check the selection below falls back to a STALE comment
          # from a PRIOR head SHA — wrongly BLOCKING a clean head (a stale MAJOR
          # lingers) or, worse, wrongly PASSING a dirty head (a stale "No issues
          # found." green-lights code the plugin never saw). So we anchor on the
          # head commit's committer time and treat any comment older than it as
          # not-a-verdict-for-this-head. ISO-8601 UTC timestamps (…Z) from the
          # API compare correctly as plain strings.
          pr_json=$(gh pr view "$PR" --repo "$REPO" --json headRefOid,state,isDraft)
          HEAD_SHA=$(jq -r '.headRefOid' <<<"$pr_json")
          # PR_STATE (#1228) gates the post-factum carve-out in the total==0
          # branch below: OPEN | MERGED | CLOSED.
          PR_STATE=$(jq -r '.state' <<<"$pr_json")
          # IS_DRAFT (#1434) carves drafts out of the has_code check below: the
          # plugin declines drafts at its eligibility check by design, and a
          # draft cannot merge, so there is no merge to gate.
          IS_DRAFT=$(jq -r '.isDraft' <<<"$pr_json")
          HEAD_TIME=$(gh api "repos/$REPO/commits/$HEAD_SHA" -q .commit.committer.date)

          # Freshness anchor (#1134). Normal path: anchor on HEAD_TIME (above).
          # Autobase path (SKIP=true — this push is an osasuwu-ci[bot] auto-
          # rebase): HEAD is the bot's just-made 2-parent merge commit. No review
          # comment is newer than that, so anchoring on it is an anchor-trap — a
          # clean PR fail-closes forever AND #1131's live CRITICAL (posted for the
          # last real head) reads as stale. Instead anchor on the LAST NON-BOT
          # HEAD: the committer date of the most recent PR commit whose author is
          # not osasuwu-ci[bot], walking newest→oldest so a run of consecutive
          # auto-rebases (PR #963 had 28) is skipped — parents[0] alone would not
          # suffice. A null/unlinked commit author counts as real (safe default:
          # it keeps a comment eligible rather than dropping it). If (impossibly)
          # every commit is the bot, fall back to HEAD_TIME → strict freshness →
          # fail-closed rather than pass unverified.
          if [ "${SKIP:-}" = "true" ]; then
            ANCHOR_TIME=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
              | jq -rs 'add
                  | map(select((.author.login // "") != "osasuwu-ci[bot]"))
                  | (.[-1].commit.committer.date // "")')
            if [ -z "$ANCHOR_TIME" ]; then ANCHOR_TIME="$HEAD_TIME"; fi
            echo "::notice::autobase push — anchoring review freshness on last non-bot head ($ANCHOR_TIME) instead of the bot merge commit ($HEAD_TIME)."
          else
            ANCHOR_TIME="$HEAD_TIME"
          fi

          # Selection happens in standalone jq, not gh's --jq:
          #   - gh rejects `--slurp` combined with `--jq` (despite the help
          #     text), and without slurping, --jq runs per page so `.[-1]`
          #     is per-page latest, not global-latest. `gh api --paginate`
          #     emits one JSON array per page back-to-back; `jq -s` slurps
          #     them and `add` flattens to one comment list.
          #   - gh's --jq is gojq (Go regexp), where ^ matches string start
          #     only. The (^|\n) anchor is line-anchored in every engine —
          #     keep it even under Oniguruma jq, so the pattern survives
          #     being moved between the two.
          # `total` = all code-review-titled comments (any age); `freshBody` =
          # body of the latest one created at/after the head commit ($head).
          #
          # Grace window (#1469): this step RACES the run that posts the
          # verdict comment — they live in DIFFERENT workflow runs. On an
          # autobase push this run starts while the real review (triggered by
          # the prior non-bot push) is still writing its comment; on PR #1492
          # this step failed closed at 09:33:39Z and the clean verdict landed
          # at 09:34:01Z — 22 seconds later. The error text says "re-run",
          # but in AFK operation nobody is there to re-run, so the race
          # silently stalls auto-merge. So the STALE-ONLY state (comments
          # exist, none fresh for the anchor) is re-polled for a bounded
          # window before the fail-closed branch below fires. Only that state
          # retries: total==0 breaks out immediately (it has its own lineage
          # probes below and self-heals via code-review-retry — polling would
          # add the full window to every legitimate skip), and a fresh body
          # proceeds immediately. After the window the stale-only branch
          # fails closed exactly as before (#993): the window widens WHEN the
          # verdict is read, never WHAT passes it.
          GRACE_DEADLINE=$(( SECONDS + 300 ))
          while :; do
            sel=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
              | jq -rs --arg head "$ANCHOR_TIME" 'add
                  | map(select(.body | test("(^|\\n)#{1,6}[ \\t]*(Claude[ \\t]+)?Code[ \\t]+Review"; "i")))
                  | { total: length,
                      freshBody: ( map(select(.created_at >= $head)) | (.[-1].body // "") ) }
                  | @json')
            total=$(jq -r '.total' <<<"$sel")
            body=$(jq -r '.freshBody' <<<"$sel")
            if [ "$total" -eq 0 ] || [ -n "$body" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$GRACE_DEADLINE" ]; then
              break
            fi
            echo "::notice::/code-review comments exist but none newer than anchor $ANCHOR_TIME yet — the posting run may still be writing (#1469). Retrying in 20s ($(( GRACE_DEADLINE - SECONDS ))s left in grace window)."
            sleep 20
          done

          if [ "$total" -eq 0 ]; then
            # No /code-review comment at all. Comment-absence alone does NOT
            # mean "the plugin skipped" — it is ambiguous across THREE states,
            # decided in this order (#1228, #1182):
            #
            #   1. Post-factum run on a non-OPEN PR. A workflow_dispatch re-run
            #      against a merged/closed PR: the plugin correctly declines to
            #      review it and posts nothing. There is no merge left to gate,
            #      so failing closed is pure noise — run 29986227927 went red on
            #      merged #1226 for exactly this. PASS.
            #   2. Never reviewed. Every code-review run over this PR's own
            #      commits CONCLUDED IN FAILURE, so no attempt ever got far
            #      enough to post a verdict. This is the #1226 hole: three runs
            #      died on permission_denials, a later osasuwu-ci[bot] auto-
            #      rebase push skipped review as designed, this gate found no
            #      comment, read it as "likely skipped", went green, and native
            #      auto-merge shipped the PR completely un-reviewed. FAIL CLOSED.
            #   3. Ran-but-silent. The review step WAS eligible and ran. The
            #      prior "Verify review ran cleanly" step already confirmed
            #      is_error=false, and under its blinded-only policy (#1242) a
            #      denial-bearing run with NO fresh verdict fails there — so
            #      reaching here with zero comments implies the run was in
            #      fact denial-free, yet the model posted zero comments. Passing it
            #      ships the PR unreviewed (PR #1179 incident). FAIL CLOSED —
            #      UNLESS the PR was a draft at run time (#1733): the
            #      `/code-review` plugin silently declines drafts at its own
            #      eligibility check by design (no comment posted, same as the
            #      IS_DRAFT carve-out at state 5 below), so a clean run with
            #      zero comments on a draft is expected, not silent failure.
            #      EXEC_FILE is only ever populated when the review step
            #      actually ran, so its presence (combined with !IS_DRAFT)
            #      identifies this state.
            #   4. Still being reviewed. A code-review run over this PR's own
            #      commits has NOT completed, so nothing has verified this head
            #      yet. This is the #1434 hole: the autobase carve-out assumes
            #      "no new code, so the existing review stands", but state 2 only
            #      looks at runs that already CONCLUDED in failure — a review
            #      mid-flight is invisible to it. On 2026-08-07 an auto-rebase
            #      push passed this gate while the real review was still running
            #      and auto-merge shipped the PR; it happened twice in thirty
            #      minutes (#1429, #1435), both merged unreviewed. FAIL CLOSED —
            #      code-review-retry reruns the failed run in place (#1325); the
            #      autobase step's own github.run_attempt == 1 gate (#1523)
            #      disarms the skip on that rerun and performs a genuine
            #      review, so this self-heals.
            #   5. Never reviewed, silently. The PR carries a substantive diff,
            #      no verdict comment exists, nothing failed and nothing is in
            #      flight to explain it. A completed review always posts a
            #      comment, so this PR was not reviewed. FAIL CLOSED (#1434):
            #      passing here requires positive evidence that there was nothing
            #      to review, not merely the absence of a failure.
            #
            # Falling through all five = legitimate skip: genuinely nothing to
            # review (has_code=false), a draft the plugin declines and that
            # cannot merge anyway, or an event that never computed has_code
            # (workflow_dispatch → unknown, which must not fail closed). PASS.
            if [ "$PR_STATE" != "OPEN" ]; then
              echo "::notice::PR is $PR_STATE and has no /code-review comment; nothing left to gate on a post-factum run. Treating as pass."
              exit 0
            fi

            # Head-lineage probe. Intersect this workflow's runs with the PR's
            # own commit SHAs once, so another PR's broken or running review can
            # never block this one, then read two independent signals off that
            # slice. The currently-executing run is excluded by id — it is in
            # flight by definition and would otherwise self-block every run.
            lineage_shas=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
              | jq -rs 'add | map(.sha)')
            lineage_runs=$(gh api "repos/$REPO/actions/workflows/code-review.yml/runs?per_page=100" --paginate \
              | jq -s --argjson shas "$lineage_shas" --arg cur "${GITHUB_RUN_ID:-}" '
                  [ .[].workflow_runs[]
                    | select((.id | tostring) != $cur)
                    | select(.head_sha as $s | $shas | index($s) != null) ]')

            # (2) Dead attempts: only `conclusion == "failure"` counts — success,
            # cancelled and skipped are not evidence of a run that died before it
            # could post.
            LINEAGE_FAILED=$(jq -r '[ .[] | select(.conclusion == "failure") ] | length' <<<"$lineage_runs")
            if [ "$LINEAGE_FAILED" -gt 0 ]; then
              echo "::error::No /code-review verdict comment exists and $LINEAGE_FAILED code-review run(s) over this PR's commits ended in failure. Every review attempt died before it could post — this PR has never been reviewed. Failing closed (#1228); fix the failing run and re-review."
              exit 1
            fi

            # (4) Reviews still in flight (#1434). Keyed on `status != "completed"`
            # rather than an enumeration of queued/waiting/in_progress/pending, so
            # a status GitHub adds later fails closed instead of silently reading
            # as done.
            LINEAGE_INFLIGHT=$(jq -r '[ .[] | select(.status != "completed") ] | length' <<<"$lineage_runs")
            if [ "$LINEAGE_INFLIGHT" -gt 0 ]; then
              inflight_ids=$(jq -r '[ .[] | select(.status != "completed") | .id | tostring ] | join(", ")' <<<"$lineage_runs")
              echo "::error::No /code-review verdict comment exists yet and $LINEAGE_INFLIGHT code-review run(s) over this PR's commits are still running (run id(s): $inflight_ids). Nothing has verified this head, so there is no prior review for this push to carry forward. Failing closed (#1434); the gate re-evaluates once that run posts its verdict."
              exit 1
            fi

            if [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ] && [ "${IS_DRAFT:-}" != "true" ]; then
              echo "::error::Code review ran cleanly (execution log present, 0 errors/denials per the prior step) but posted zero /code-review comments. This is a silent no-review, not a legitimate skip. Failing closed; re-run code-review."
              exit 1
            fi

            # (5) Positive-evidence gate (#1434). has_code is computed over the
            # PR's full base...HEAD diff, so it is meaningful even when this
            # event's own push added nothing. Empty means the event never
            # computed it (workflow_dispatch) — unknown, so pass, or post-factum
            # dispatch breaks.
            if [ "${HAS_CODE:-}" = "true" ] && [ "${IS_DRAFT:-}" != "true" ]; then
              echo "::error::This PR carries a substantive diff but has no /code-review verdict comment, and no code-review run over its commits failed or is still running. A completed review always posts a comment, so this PR was never reviewed. Failing closed (#1434); re-run code-review."
              exit 1
            fi

            echo "::notice::No /code-review comment present, review did not run, LINEAGE_FAILED=$LINEAGE_FAILED, LINEAGE_INFLIGHT=$LINEAGE_INFLIGHT, HAS_CODE='${HAS_CODE:-unknown}', IS_DRAFT='${IS_DRAFT:-unknown}' — there was nothing to review, so the plugin legitimately skipped. Treating as pass."
            exit 0
          fi

          # ---------------------------------------------------------------
          # COMMIT-FREE CLEAN RE-REVIEW OVERRIDE (#133)
          # ---------------------------------------------------------------
          # A retry/re-dispatch over the SAME head_sha (no new commit) whose
          # review completes cleanly (0 errors/denials, confirmed by the
          # prior "Verify review ran cleanly" step — this step would not be
          # running otherwise) but the plugin declines to re-post because
          # nothing changed since the last review of this exact head is
          # documented, normal plugin behaviour (#133) — NOT a silent
          # failure. Without this override the stale prior comment (or its
          # absence) is re-evaluated forever and a commit-free fix (e.g. an
          # infra/config correction with no diff change) can never produce a
          # fresh PASS.
          #
          # Scoped narrowly so the #1179/#1239 "first-time silent no-review"
          # floor above is untouched:
          #   - only reachable once total>0 has already been established
          #     above (never overrides a genuinely first-ever review of a
          #     new commit — the total==0 branch's own ran-but-silent check
          #     still fails closed unconditionally);
          #   - CLEAN_RERUN requires EXEC_FILE from THIS run (a run whose
          #     review did not execute, e.g. autobase-skip, cannot claim
          #     this path — it never re-examined anything);
          #   - PRIOR_ATTEMPT requires a distinct prior workflow run over
          #     this EXACT head_sha (never a new, never-before-seen commit —
          #     new commits always get a first real review);
          #   - STALE_TO_THIS_RUN requires the latest comment of ANY age to
          #     predate this run's own start (RUN_START) — a comment posted
          #     DURING this run (the plugin found something new to say) is
          #     never masked; it flows through the normal ladder below
          #     unchanged.
          CLEAN_RERUN=false
          if [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ]; then
            CLEAN_RERUN=true
          fi

          PRIOR_ATTEMPT=false
          if [ "$CLEAN_RERUN" = "true" ]; then
            rerun_lineage_shas=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
              | jq -rs 'add | map(.sha)')
            rerun_lineage_runs=$(gh api "repos/$REPO/actions/workflows/code-review.yml/runs?per_page=100" --paginate \
              | jq -s --argjson shas "$rerun_lineage_shas" --arg cur "${GITHUB_RUN_ID:-}" '
                  [ .[].workflow_runs[]
                    | select((.id | tostring) != $cur)
                    | select(.head_sha == "'"$HEAD_SHA"'") ]')
            RERUN_COUNT=$(jq -r 'length' <<<"$rerun_lineage_runs")
            if [ "$RERUN_COUNT" -gt 0 ]; then
              PRIOR_ATTEMPT=true
            fi
          fi

          LATEST_ANY_CREATED=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            | jq -rs 'add
                | map(select(.body | test("(^|\\n)#{1,6}[ \\t]*(Claude[ \\t]+)?Code[ \\t]+Review"; "i")))
                | (.[-1].created_at // "")')

          STALE_TO_THIS_RUN=$(jq -rn --arg latest "$LATEST_ANY_CREATED" --arg run_start "$RUN_START" \
            '($latest == "") or ($latest < $run_start)')

          if [ "$CLEAN_RERUN" = "true" ] && [ "$PRIOR_ATTEMPT" = "true" ] && [ "$STALE_TO_THIS_RUN" = "true" ]; then
            echo "::notice::Commit-free clean re-review (#133): this run's execution log shows 0 errors/denials, a prior run already attempted head $HEAD_SHA, and no /code-review comment has landed since this run started ($RUN_START) — treating as 're-reviewed, nothing new to flag' and passing."
            exit 0
          fi

          if [ -z "$body" ]; then
            # Prior review comment(s) exist but none is newer than the freshness
            # anchor ($ANCHOR_TIME, computed above), and the #1469 grace window
            # expired without one landing. The latest review errored or never
            # posted for this head; a comment before the anchor is not its
            # verdict (#993/#1134). Fail closed; re-run code-review.
            echo "::error::/code-review comments exist but none newer than anchor $ANCHOR_TIME (head $HEAD_SHA @ $HEAD_TIME) after the grace window (#1469) — latest review likely errored. Failing closed; re-run."
            exit 1
          fi

          # STRUCTURED VERDICT, AUTHORITATIVE BOTH WAYS (#1816). Layer B always
          # emits a <!-- code-review-findings … --> HTML comment whose JSON is
          # the single binary verdict: {"blocking": bool, "findings": [{"class",
          # "file"}, ...]}. No severity, no line number, no ladder — exactly one
          # bit of signal. It runs BEFORE the prose ladder and before
          # `export LC_ALL=C`, so jq still decodes UTF-8.
          #
          # Why authoritative in BOTH directions (revised from #1456's fail-only
          # short-circuit): under the #1816 rebuild Layer B is the sole reviewer
          # and always emits this block, so a well-formed blocking:false is a
          # real "no defect found" verdict, not something that needs the prose
          # ladder's advisory-severity heuristics to confirm. The prose ladder
          # below is kept as a defensive fallback for a comment that lacks the
          # marker entirely (a pre-rebuild or unrelated-bot comment) — it never
          # runs when a well-formed structured block is present.
          #
          # Four shapes, deliberately distinct:
          # - blocking: true                          -> exit 1 here
          # - blocking: false                         -> exit 0 here
          # - block present but payload not valid JSON, or missing/malformed
          #   "blocking" field, or blocking/findings-length mismatch (blocking
          #   asserted with an empty array, or vice versa) -> fail closed, same
          #   floor as the unrecognized-format exit at the end of this step
          # - block absent (older/unrelated comments) -> fall through, prose
          #   ladder decides. That is what keeps this additive.
          findings_block=$(sed -n '/<!-- *code-review-findings/,/-->/p' <<<"$body" | sed '1d;$d')
          if grep -q '<!-- *code-review-findings' <<<"$body"; then
            if ! jq -e . >/dev/null 2>&1 <<<"$findings_block"; then
              echo "::error::code-review-findings block present but its payload is not valid JSON. Failing closed (#1816)."
              exit 1
            fi
            blocking_type=$(jq -r 'if (.blocking | type) == "boolean" then "ok" else "bad" end' <<<"$findings_block")
            findings_type=$(jq -r 'if (.findings | type) == "array" then "ok" else "bad" end' <<<"$findings_block")
            if [ "$blocking_type" != "ok" ] || [ "$findings_type" != "ok" ]; then
              echo "::error::code-review-findings block present but 'blocking' (bool) or 'findings' (array) is missing/malformed. Failing closed (#1816)."
              exit 1
            fi
            consistent=$(jq -r 'if .blocking == ((.findings | length) > 0) then "ok" else "bad" end' <<<"$findings_block")
            if [ "$consistent" != "ok" ]; then
              echo "::error::code-review-findings block is schema-inconsistent (blocking does not match whether findings is empty). Failing closed (#1816)."
              exit 1
            fi
            blocking=$(jq -r '.blocking' <<<"$findings_block")
            if [ "$blocking" = "true" ]; then
              classes=$(jq -r '[.findings[].class] | unique | join(", ")' <<<"$findings_block")
              echo "::error::Code review reported blocking finding(s) ($classes) in its structured verdict block; blocking auto-merge until addressed."
              exit 1
            fi
            echo "::notice::Code review structured verdict: clean (#1816)."
            exit 0
          fi

          # Severity greps below classify each byte of heading decoration via the
          # POSIX class [^[:alnum:]]. Under the runner's default LANG=C.UTF-8 a
          # multibyte decoration (emoji "### 🔴 BLOCKING", #954) is read as ONE
          # alnum-ambiguous rune that [^[:alnum:]] does NOT consume, so the block
          # check silently misses and a coexisting "### MINOR" can flip the gate
          # to PASS. Forcing the C locale makes grep treat every decoration byte
          # individually (non-alnum), restoring the emoji-heading match. Set after
          # the jq body extraction so JSON decoding stays UTF-8 aware.
          export LC_ALL=C

          # Two-gate model (#988): the MERGE gate blocks ONLY on a real merge-
          # blocking finding — an all-caps CRITICAL/MAJOR/BLOCKING severity
          # heading. The block check runs FIRST so no pass signal below can
          # shadow it (a findings comment may carry an incidental
          # "No issues found." or "Blocking issues — None" line).
          #
          # - [^[:alnum:]]* tolerates decoration between the #'s and the
          #   severity word (emoji/whitespace — "### 🔴 BLOCKING" on #954); the
          #   findings/issues suffix is optional ("### MAJOR" bare on #956).
          # - grep -qE (NOT -qiE): the block check is case-SENSITIVE all-caps
          #   (#976). Real plugin severity sections are all-caps; title-case
          #   prose like "### Blocking issues — None" (#962) must NOT block,
          #   nor does title-case "Medium" advisory prose (same precedent).
          # - MINOR is DROPPED from the alternation. Minors never block merge —
          #   they are swept best-effort by /rework while it is already in
          #   context for a bug-triggered round, not as a merge gate.
          # - MEDIUM now BLOCKS (raised from the code-review two-gate model,
          #   #1385 follow-up): a MEDIUM finding can genuinely corrupt state
          #   in the moment, unlike MINOR/LOW/INFO/NITPICK advisories, so it
          #   is promoted into the same all-caps blocking alternation as
          #   CRITICAL/MAJOR/BLOCKING rather than staying merge-gate-advisory.
          if grep -qE '^#{1,6}[^[:alnum:]]*(CRITICAL|MAJOR|BLOCKING|MEDIUM)\b' <<<"$body"; then
            echo "::error::Code review posted blocking severity sections (CRITICAL/MAJOR/BLOCKING/MEDIUM); blocking auto-merge until addressed."
            exit 1
          fi

          # No blocking severity heading. Any recognized non-blocking shape is
          # a positive pass. Order among the pass checks is immaterial (all
          # exit 0); only block-before-pass matters.

          # Clean: line-start, NO end anchor (the plugin spec's clean example
          # carries trailing prose on the same line).
          if grep -qE '^No issues found\.' <<<"$body"; then
            echo "::notice::Code review clean."
            exit 0
          fi

          # APPROVE summary "Blocking issues — None" (#962). Case-insensitive —
          # it is title-case prose, and it is only reached after the block
          # check, so it can never shadow a real all-caps severity section.
          if grep -qiE 'blocking issues\b[^[:alnum:]]*none\b' <<<"$body"; then
            echo "::notice::Code review reports no blocking issues."
            exit 0
          fi

          # Findings present but none blocking: canonical "Found N issues:".
          # Under the two-gate model this is a PASS, not a block — in practice
          # the plugin emits severity sections for real bugs (#963/#964/#965/
          # #966) and bare Found-N has carried only advisory MEDIUM/LOW (#956).
          # Residual risk (a no-severity-heading comment hiding real majors)
          # accepted per #988.
          if grep -qE 'Found [0-9]+ issues?:' <<<"$body"; then
            count=$(grep -oE 'Found [0-9]+ issues?:' <<<"$body" | head -1 | grep -oE '[0-9]+')
            echo "::notice::Code review found $count non-blocking issue(s); not blocking auto-merge (two-gate model)."
            exit 0
          fi

          # Non-blocking severity sections only: MINOR-only (#963) or MEDIUM/
          # LOW/INFO/NITPICK advisories with no Found-N line. MEDIUM STAYS in
          # this alternation (#1385 follow-up) — a real all-caps "### MEDIUM"
          # finding is already caught by the case-sensitive block check above
          # and never reaches here; only a title-case "Medium" heading (plugin
          # decorative prose, not a real severity signal, same as title-case
          # "Blocking"/"Critical") lands in this case-insensitive branch and
          # passes.
          # Case-INSENSITIVE (-qiE, #1050): the plugin sometimes title-cases
          # advisory headings ("#### Low" on PR #1049), which the old all-caps
          # -qE dropped → the gate fell through to fail-closed on a clean
          # verdict. Safe to be lenient here: this runs strictly AFTER the
          # case-sensitive block check (line ~326), so a title-case match can
          # never shadow a real all-caps CRITICAL/MAJOR/BLOCKING/MEDIUM
          # section. The block check itself stays -qE (case-sensitive) per
          # #962/#976.
          if grep -qiE '^#{1,6}[^[:alnum:]]*(MINOR|NITPICK|LOW|INFO|MEDIUM)\b' <<<"$body"; then
            echo "::notice::Code review posted only non-blocking severity sections; not blocking auto-merge."
            exit 0
          fi

          # Explicit positive verdict with no blocking heading: bare "LGTM" or
          # a "Verdict: … APPROVE/APPROVED" summary (#1050 — PR #1049 posted
          # "**Verdict: LGTM with one minor note**" with no recognized severity
          # heading and no "No issues found." line). Case-insensitive; reached
          # only after the block check, so it can never green-light a real
          # all-caps severity section.
          if grep -qiE '\bLGTM\b|Verdict:[^\n]*\bAPPROVED?\b' <<<"$body"; then
            echo "::notice::Code review posted a positive LGTM/APPROVE verdict; not blocking auto-merge."
            exit 0
          fi

          # Unrecognized format — fail closed so a malformed or deviant
          # comment can't slip past auto-merge (cf. PR #957 false-pass).
          echo "::error::Could not parse /code-review verdict from latest review comment. Failing closed."
          exit 1
