name: Structure gate

on:
  pull_request:

jobs:
  structure-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run structure gate test
        run: python -m pytest tests/test_structure_gate.py tests/test_jarvis_setup_skill.py -v
